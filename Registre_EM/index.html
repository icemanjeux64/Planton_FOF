<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Protocol EM - FOF Tactical</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;800&display=swap');
        
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; background-color: transparent; color: #00f2ff; }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: rgba(0, 242, 255, 0.05); }
        ::-webkit-scrollbar-thumb { background: rgba(0, 242, 255, 0.4); border-radius: 10px; }
        
        .fade-in { animation: fadeIn 0.2s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        
        input[type="text"] { font-size: 16px !important; }
        
        .mode-tab { transition: all 0.2s ease; border-width: 2px; }
        .active-mode-blue { border-color: #00f2ff !important; background: rgba(0, 242, 255, 0.1) !important; color: #fff !important; text-shadow: 0 0 10px rgba(0,242,255,0.5); }
        .active-mode-orange { border-color: #facc15 !important; background: rgba(250, 204, 21, 0.1) !important; color: #fff !important; text-shadow: 0 0 10px rgba(250,204,21,0.5); }
        .inactive-tab { opacity: 0.3; filter: grayscale(100%); border-color: rgba(0,242,255,0.2) !important; color: #00f2ff !important; }

        .card-shadow { box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.9), inset 0 0 40px rgba(0, 0, 0, 0.5); }
        .glow-green { text-shadow: 0 0 10px rgba(57, 255, 20, 0.5); }
        .glow-orange { text-shadow: 0 0 10px rgba(250, 204, 21, 0.5); }
        .glow-red { text-shadow: 0 0 10px rgba(255, 62, 62, 0.5); }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 
                        military: { 
                            950: 'transparent',
                            900: 'rgba(4, 10, 16, 0.97)', 
                            800: 'rgba(0, 242, 255, 0.05)', 
                            700: 'rgba(0, 242, 255, 0.2)', 
                            accent: '#00f2ff',
                            valid: '#39ff14',
                            warn: '#facc15',
                            alert: '#ff3e3e'
                        } 
                    },
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        inter: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-transparent h-screen flex flex-col overflow-hidden">



    <div class="grid grid-cols-2 bg-military-900 border-b border-military-700 p-3 gap-3 shrink-0">
        <button onclick="setMode('light')" id="tab-light" class="mode-tab py-3.5 flex flex-col items-center justify-center rounded-xl border-2">
            <span class="text-xs font-orbitron font-black uppercase tracking-wider">Mode Light</span>
            <span class="text-[8px] font-orbitron font-bold opacity-60 tracking-widest mt-1">< 30 JOUEURS</span>
        </button>
        <button onclick="setMode('heavy')" id="tab-heavy" class="mode-tab py-3.5 flex flex-col items-center justify-center rounded-xl border-2">
            <span class="text-xs font-orbitron font-black uppercase tracking-wider">Affluence</span>
            <span class="text-[8px] font-orbitron font-bold opacity-60 tracking-widest mt-1">≥ 30 JOUEURS</span>
        </button>
    </div>

    <div class="px-4 py-2 bg-transparent shrink-0 relative z-10 border-b border-military-700">
        <div class="relative group">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <i data-lucide="search" class="text-military-accent w-4 h-4 opacity-40 group-focus-within:opacity-100 transition-opacity"></i>
            </div>
            <input type="text" id="searchInput" class="block w-full pl-10 pr-3 py-2 bg-military-900 border-2 border-military-700 rounded-xl text-sm text-white font-orbitron placeholder-military-700 focus:border-military-accent focus:shadow-[0_0_15px_rgba(0,242,255,0.15)] outline-none transition-all shadow-inner" placeholder="PSEUDO DU JOUEUR..." autocomplete="off">
        </div>
    </div>

    <main class="flex-1 overflow-y-auto p-4 pb-20">
        <div id="resultsGrid" class="space-y-4 max-w-lg mx-auto">
            <div class="text-center py-24 opacity-20">
                <i data-lucide="cpu" class="w-16 h-16 mx-auto mb-4 text-military-accent animate-pulse"></i>
                <p class="text-[10px] font-orbitron tracking-[0.5em] uppercase text-military-accent">Scan Identification</p>
            </div>
        </div>
    </main>



    <script src="../fof_data_full.js"></script>

    <script>
        let currentMode = 'light';
        let allPlayers = [];

        if (typeof FOF_DATA !== 'undefined') {
            Object.keys(FOF_DATA.gradeDetails).forEach(grade => {
                FOF_DATA.gradeDetails[grade].forEach(p => { allPlayers.push({ ...p, currentGrade: grade }); });
            });
        }

        function updateDateTime() {
            const now = new Date();
            const timeEl = document.getElementById('current-time');
            const dateEl = document.getElementById('current-date');
            if (timeEl) timeEl.textContent = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            if (dateEl) dateEl.textContent = now.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        function setMode(mode) {
            currentMode = mode;
            const tabLight = document.getElementById('tab-light');
            const tabHeavy = document.getElementById('tab-heavy');
            if (!tabLight || !tabHeavy) return;
            if (mode === 'light') {
                tabLight.className = "mode-tab py-3.5 flex flex-col items-center justify-center rounded-xl border-2 active-mode-blue shadow-lg";
                tabHeavy.className = "mode-tab py-3.5 flex flex-col items-center justify-center rounded-xl border-2 inactive-tab";
            } else {
                tabHeavy.className = "mode-tab py-3.5 flex flex-col items-center justify-center rounded-xl border-2 active-mode-orange shadow-lg";
                tabLight.className = "mode-tab py-3.5 flex flex-col items-center justify-center rounded-xl border-2 inactive-tab";
            }
            executeSearch();
        }

        function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            const ov = document.getElementById('sidebarOverlay');
            if (sb && ov) { sb.classList.toggle('translate-x-full'); ov.classList.toggle('hidden'); }
        }

        function executeSearch() {
            const searchInput = document.getElementById('searchInput');
            if (!searchInput) return;
            const query = searchInput.value.toLowerCase().trim();
            const grid = document.getElementById('resultsGrid');
            if (query === '') {
                grid.innerHTML = `<div class="text-center py-24 opacity-10"><i data-lucide="shield" class="w-16 h-16 mx-auto mb-4"></i><p class="text-[10px] font-mono tracking-[0.5em] uppercase">Scan Identification</p></div>`;
                lucide.createIcons();
                return;
            }
            const results = allPlayers.filter(p => 
                p.name.toLowerCase().includes(query) || 
                (p.username && p.username.toLowerCase().includes(query))
            );
            if (results.length === 0) {
                grid.innerHTML = `
                    <div class="bg-military-900 border-2 border-military-alert rounded-2xl p-6 fade-in text-center card-shadow">
                        <i data-lucide="user-x" class="text-military-alert w-12 h-12 mx-auto mb-2"></i>
                        <h3 class="text-lg font-orbitron font-black text-military-alert uppercase tracking-widest glow-red">HORS REGISTRE</h3>
                        <p class="text-[10px] font-orbitron font-bold text-gray-400 mt-2 uppercase tracking-widest">FUSILIER SEUL - ÉVICTION PRIORITAIRE</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }
            grid.innerHTML = results.slice(0, 8).map(p => renderPlayerCard(p)).join('');
            lucide.createIcons();
        }

        function renderPlayerCard(p) {
            const isRecrue = p.currentGrade === "Recrue";
            const isVisiteur = p.currentGrade === "Membre (Non-LM)";
            const isCadre = ["Lieutenant", "Capitaine", "Major", "Adjudant Chef", "Adjudant", "Colonel", "Général"].some(g => p.currentGrade.includes(g));
            
            let status = "AUTHORIZED";
            if (isVisiteur) { status = currentMode === 'light' ? "RESTRICTED" : "DENIED"; }

            let accentColor, statusText, complianceText, complianceColor, glowClass, instructions = [];
            
            if (isCadre) {
                accentColor = "military-valid"; statusText = "ACCÈS PRIORITAIRE";
                complianceText = "REGISTRE CONFORME"; complianceColor = "text-military-valid"; glowClass = "glow-green";
                instructions = ["COMMANDEMENT LIBRE.", "SPÉCIALITÉ LIBRE.", "DROIT D'ÉVICTION TOTAL."];
            } else if (isRecrue) {
                accentColor = "military-valid"; statusText = "ACCÈS VALIDE";
                complianceText = "REGISTRE CONFORME"; complianceColor = "text-military-valid"; glowClass = "glow-green";
                instructions = ["SPÉ AUTORISÉE.", "PRIORITAIRE SUR VISITEURS.", "PLACE GARANTIE."];
            } else if (isVisiteur) {
                complianceText = "DOSSIER INCOMPLET (SANS LM)";
                if (currentMode === 'light') {
                    accentColor = "military-warn"; statusText = "DERNIER RECOURS";
                    complianceColor = "text-military-warn"; glowClass = "glow-orange";
                    instructions = ["SPÉ SI PAS LE CHOIX.", "NON-PRIORITAIRE.", "POSTER LM SUR DISCORD."];
                } else {
                    accentColor = "military-alert"; statusText = "HORS PROTOCOLE";
                    complianceColor = "text-military-alert"; glowClass = "glow-red";
                    instructions = ["FUSILIER SEUL.", "ÉVICTION SI MEMBRE.", "ACCÈS RESTREINT."];
                }
            } else {
                accentColor = "military-valid"; statusText = "ACCÈS VALIDE";
                complianceText = "REGISTRE CONFORME"; complianceColor = "text-military-valid"; glowClass = "glow-green";
                instructions = ["SPÉCIALITÉS LIBRES.", "PRIORITAIRE SUR RECRUES.", "DROIT D'ÉVICTION."];
            }

            const borderClass = `border-[3px] border-${accentColor}`;
            const icon = status === 'DENIED' ? 'x-circle' : (status === 'RESTRICTED' ? 'alert-circle' : 'shield-check');

            return `
                <div class="bg-military-900 ${borderClass} rounded-2xl overflow-hidden fade-in card-shadow">
                    <div class="p-4 flex flex-col gap-4 relative">
                        <!-- LIGNE 1 : IDENTITÉ -->
                        <div class="flex gap-4 items-start">
                            <div class="relative shrink-0">
                                <img src="${p.avatar || 'https://ui-avatars.com/api/?name=' + p.name + '&background=1f2937&color=fff'}" class="w-16 h-16 rounded-2xl border-2 border-military-700 shadow-xl object-cover">
                                <div class="absolute -top-1 -right-1 w-4 h-4 bg-${accentColor} rounded-full border-2 border-military-900 shadow-lg"></div>
                            </div>

                            <div class="flex-1 min-w-0">
                                <div class="flex items-center gap-2 flex-wrap">
                                    <h3 class="text-lg font-orbitron font-black text-white truncate uppercase tracking-widest">${p.name}</h3>
                                    ${p.isStaff ? '<span class="bg-military-alert text-[8px] font-orbitron font-black px-1.5 py-0.5 rounded text-black shadow-lg">STAFF</span>' : ''}
                                </div>
                                <div class="flex flex-col mt-0.5">
                                    <span class="text-xs font-orbitron font-bold text-gray-300 uppercase tracking-widest">${p.currentGrade}</span>
                                    <div class="flex items-center gap-1.5 mt-1">
                                        <i data-lucide="at-sign" class="w-3 h-3 text-military-accent"></i>
                                        <span class="text-[9px] font-bold font-orbitron text-military-accent uppercase tracking-wider">${p.username || 'Inconnu'}</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- LIGNE 2 : INFOS REGISTRE -->
                        <div class="grid grid-cols-2 gap-3 mt-1">
                            <div class="bg-black/40 p-2 rounded-xl border border-white/5 shadow-inner">
                                <p class="text-[8px] font-black text-gray-500 uppercase tracking-widest mb-1">Date d'arrivée</p>
                                <p class="text-[11px] font-black text-white">${p.joinedAt}</p>
                            </div>
                            <div class="bg-black/40 p-2 rounded-xl border border-white/5 shadow-inner">
                                <p class="text-[8px] font-black text-gray-500 uppercase tracking-widest mb-1">Ancienneté</p>
                                <p class="text-[11px] font-black text-white">${p.days} JOURS</p>
                            </div>
                        </div>

                        <!-- LIGNE 3 : VERDICT AVEC ICONE -->
                        <div class="mt-1 flex items-center justify-between bg-black/40 px-3 py-2.5 rounded-xl border border-white/5 shadow-inner">
                            <div class="flex items-center gap-2">
                                <i data-lucide="${icon}" class="text-${accentColor} w-5 h-5 ${glowClass}"></i>
                                <span class="text-[10px] font-orbitron font-black ${complianceColor} uppercase tracking-widest ${glowClass}">
                                    ${complianceText}
                                </span>
                            </div>
                            <span class="text-[9px] font-orbitron font-black text-white uppercase tracking-widest bg-${accentColor}/20 px-2 py-1 rounded border border-${accentColor}/30">
                                ${statusText}
                            </span>
                        </div>
                    </div>

                    <!-- LIGNE 4 : CONSIGNES -->
                    <div class="px-5 py-4 bg-black/40 border-t border-military-700">
                        <ul class="space-y-2">
                            ${instructions.map(i => `
                                <li class="flex items-start gap-3 text-[11px] font-orbitron tracking-widest text-white leading-tight">
                                    <i data-lucide="chevron-right" class="w-3 h-3 text-${accentColor} shrink-0 mt-0.5"></i>
                                    <span>${i}</span>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                </div>
            `;
        }

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            setInterval(updateDateTime, 1000);
            updateDateTime();
            setMode('light');
            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.addEventListener('input', () => {
                    clearTimeout(window.searchTimer);
                    window.searchTimer = setTimeout(executeSearch, 200);
                });
            }
        });
    </script>
</body>
</html>
